<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>座位查詢 — Shawn & Emma Wedding</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=La+Belle+Aurore&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+JP:wght@200;300;400;500;600;700&family=Roboto+Condensed:wght@300;400;500;700&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════════
       VARIABLES — 沿用 index.html 色彩系統
       ═══════════════════════════════════════════ */
    :root {
      --color-bg: #1a1a1a;
      --color-bg-warm: #222220;
      --color-bg-deep: #141413;
      --color-surface: #2a2a28;
      --color-accent: #c8553a;
      --color-accent-light: #e07455;
      --color-accent-soft: #d4785f;
      --color-accent-dark: #943d2a;
      --color-accent-glow: rgba(200, 85, 58, 0.15);
      --color-white: #fafafa;
      --color-white-warm: #f0ece6;
      --color-white-muted: rgba(250, 250, 250, 0.55);
      --color-white-semi: rgba(250, 250, 250, 0.4);
      --color-text: #c8c4bc;
      --color-divider: rgba(200, 85, 58, 0.18);
      --color-highlight: #c8553a;
      --color-highlight-glow: rgba(200, 85, 58, 0.35);
      --color-inactive: #2a2a28;
      --color-inactive-text: rgba(200, 196, 188, 0.35);
      --font-display: 'La Belle Aurore', 'Shippori Mincho', serif;
      --font-jp: 'Shippori Mincho', 'Noto Serif JP', serif;
      --font-zh: 'Noto Sans TC', sans-serif;
      --font-body: 'Zen Kaku Gothic New', sans-serif;
      --font-cjk: 'Noto Sans TC', sans-serif;
      --radius: 14px;
      --table-radius: 25px;
      --ease: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ═══════════════════════════════════════════
       RESET
       ═══════════════════════════════════════════ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-cjk);
      background-color: var(--color-bg);
      background-image:
        linear-gradient(rgba(43, 43, 43, 0.88), rgba(108, 108, 108, 0.88)),
        url('https://res.cloudinary.com/dnqduthcp/image/upload/v1775293758/digital-art-with-organic-floral-shapes_r2qs7q.png');
      background-attachment: fixed;
      background-size: cover;
      background-position: center;
      background-blend-mode: multiply;
      color: var(--color-text);
      min-height: 100dvh;
      overflow-x: hidden;
      line-height: 1.7;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: 0.01;
      background-image: url('https://res.cloudinary.com/dnqduthcp/image/upload/v1775293758/digital-art-with-organic-floral-shapes_r2qs7q.png');
      background-size: 600px;
      background-repeat: repeat;
    }

    /* ═══════════════════════════════════════════
       RESULT ACTIONS
       ═══════════════════════════════════════════ */
    .result-actions {
      display: flex;
      flex-shrink: 0;
      gap: 12px;
      margin-top: 18px;
      margin-bottom: 12px;
    }

    .result-actions .btn-retry {
      margin: 0;
    }

    .back-btn {
      text-decoration: none;
    }

    /* ═══════════════════════════════════════════
       SCREEN STATES
       ═══════════════════════════════════════════ */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity .45s var(--ease), visibility .45s;
    }

    .screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .screen.visible {
      opacity: 1;
      visibility: visible;
    }

    /* ═══════════════════════════════════════════
       LOADING
       ═══════════════════════════════════════════ */
    .loader-wrap {
      text-align: center;
    }

    .loader-ring {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      border: 2px solid var(--color-divider);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      font-family: var(--font-display);
      color: var(--color-accent);
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0;
      animation: loaderPulse 1.5s ease-in-out infinite;
    }

    @keyframes loaderPulse {

      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 1;
      }
    }

    /* ═══════════════════════════════════════════
       INPUT SCREEN
       ═══════════════════════════════════════════ */
    .input-card {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .input-subtitle {
      font-family: var(--font-display);
      font-size: 0.75rem;
      color: var(--color-accent);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }

    .input-title {
      font-family: var(--font-cjk);
      font-weight: 500;
      font-size: 2rem;
      color: var(--color-white-warm);
      margin-bottom: 0.5rem;
      letter-spacing: 0.1em;
    }

    .input-desc {
      font-size: 0.88rem;
      color: var(--color-white-muted);
      margin-bottom: 2rem;
    }

    /* Accent line */
    .accent-line {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--color-accent), transparent);
      margin: 1.2rem auto 1.5rem;
    }

    .input-field-wrap {
      display: flex;
      gap: 10px;
    }

    #guest-name {
      width: 100%;
      padding: 14px 18px;
      font-family: var(--font-cjk);
      font-size: 1rem;
      color: var(--color-white);
      border: 1.5px solid rgba(200, 85, 58, 0.25);
      border-radius: var(--radius);
      background: rgba(42, 42, 40, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      outline: none;
      transition: border-color .3s var(--ease), box-shadow .3s var(--ease);
    }

    #guest-name::placeholder {
      color: var(--color-white-semi);
    }

    #guest-name:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 20px rgba(200, 85, 58, 0.15);
    }

    #btn-search {
      padding: 14px 28px;
      font-family: var(--font-cjk);
      font-size: 1rem;
      font-weight: 500;
      color: var(--color-white);
      background: var(--color-accent);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .3s var(--ease);
      white-space: nowrap;
      letter-spacing: 0.08em;
    }

    #btn-search:hover {
      background: var(--color-accent-light);
      box-shadow: 0 8px 24px rgba(200, 85, 58, 0.3);
      transform: translateY(-1px);
    }

    #btn-search:active {
      transform: scale(.96);
      background: var(--color-accent-dark);
    }

    /* shake 動畫 */
    .shake {
      animation: shake .4s ease;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20%,
      60% {
        transform: translateX(-6px);
      }

      40%,
      80% {
        transform: translateX(6px);
      }
    }

    /* 裝飾花瓣 */
    .decorative-petals {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      font-size: 1.4rem;
      color: var(--color-accent);
      opacity: .15;
      animation: petal-float 6s ease-in-out infinite;
    }

    .p1 {
      top: 12%;
      left: 8%;
      animation-delay: 0s;
    }

    .p2 {
      top: 60%;
      right: 6%;
      animation-delay: 2s;
    }

    .p3 {
      bottom: 15%;
      left: 20%;
      animation-delay: 4s;
    }

    @keyframes petal-float {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-18px) rotate(15deg);
      }
    }

    /* ═══════════════════════════════════════════
       RESULT SCREEN
       ═══════════════════════════════════════════ */
    #screen-result {
      justify-content: flex-start;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
      overflow-y: auto;
    }

    .result-info {
      text-align: center;
      padding: 20px 16px 12px;
      width: 100%;
      max-width: 500px;
    }

    .result-guest-name {
      font-family: var(--font-cjk);
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--color-white-warm);
      margin-bottom: 4px;
    }

    .result-table {
      font-size: 1.05rem;
      margin-bottom: 2px;
      color: var(--color-text);
    }

    .result-table strong {
      color: var(--color-accent-light);
    }

    .result-location {
      font-size: .88rem;
      color: var(--color-white-muted);
      margin-bottom: 4px;
    }

    .result-hint {
      font-size: .78rem;
      color: var(--color-white-semi);
      font-style: italic;
    }

    /* ═══════════════════════════════════════════
       SEATING LAYOUT
       ═══════════════════════════════════════════ */
    .seating-layout {
      display: flex;
      gap: 0;
      width: 100%;
      max-width: 600px;
      flex: 1;
      min-height: 0;
    }

    .zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 8px;
    }

    .zone-main {
      flex: 1.5;
    }

    .zone-title {
      font-family: var(--font-display);
      font-size: .85rem;
      font-weight: 400;
      color: var(--color-accent-soft);
      letter-spacing: .15em;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .zone-divider {
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--color-divider), transparent);
      align-self: stretch;
      margin: 10px 0;
      border-radius: 1px;
    }

    /* ═══════════════════════════════════════════
       TABLE GRID
       ═══════════════════════════════════════════ */
    .table-grid {
      display: grid;
      gap: 10px;
      width: 100%;
      flex: 1;
      align-content: start;
    }

    /* 主場地：3 欄，col1/col2 各 3 桌，col3 有 4 桌 */
    .grid-main {
      align-content: space-around;
      grid-template-columns: repeat(3, minmax(0, 64px));
      justify-content: space-around;
      grid-template-rows: repeat(4, auto);
    }

    .grid-main [data-table-id="1"] {
      grid-column: 1;
      grid-row: 1;
    }

    .grid-main [data-table-id="2"] {
      grid-column: 2;
      grid-row: 1;
    }

    .grid-main [data-table-id="3"] {
      grid-column: 3;
      grid-row: 1;
    }

    .grid-main [data-table-id="4"] {
      grid-column: 1;
      grid-row: 2;
    }

    .grid-main [data-table-id="5"] {
      grid-column: 2;
      grid-row: 2;
    }

    .grid-main [data-table-id="6"] {
      grid-column: 3;
      grid-row: 2;
    }

    .grid-main [data-table-id="7"] {
      grid-column: 1;
      grid-row: 3;
    }

    .grid-main [data-table-id="8"] {
      grid-column: 2;
      grid-row: 3;
    }

    .grid-main [data-table-id="9"] {
      grid-column: 3;
      grid-row: 3;
    }

    .grid-main [data-table-id="10"] {
      grid-column: 3;
      grid-row: 4;
    }

    /* 包廂：2 欄 S 型 */
    .grid-private {
      grid-template-columns: repeat(2, minmax(0, 64px));
      justify-content: space-around;
      grid-template-rows: repeat(5, auto);
    }

    .grid-private [data-table-id="11"] {
      grid-column: 1;
      grid-row: 1;
    }

    .grid-private [data-table-id="12"] {
      grid-column: 2;
      grid-row: 2;
    }

    .grid-private [data-table-id="13"] {
      grid-column: 1;
      grid-row: 3;
    }

    .grid-private [data-table-id="14"] {
      grid-column: 2;
      grid-row: 4;
    }

    .grid-private [data-table-id="15"] {
      grid-column: 1;
      grid-row: 5;
    }

    /* 桌次卡片（圓形） */
    .table-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      border-radius: 50%;
      text-align: center;
      transition: transform .3s var(--ease), box-shadow .3s var(--ease);
    }

    .table-name {
      font-size: .62rem;
      letter-spacing: .03em;
      padding: 0 4px;
    }

    /* 高亮 — 用戶所在桌 */
    .table-active {
      background: linear-gradient(135deg, var(--color-accent), var(--color-accent-light));
      color: var(--color-white);
      box-shadow: 0 0 24px var(--color-highlight-glow), 0 4px 16px rgba(0, 0, 0, 0.3);
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .table-active .table-id {
      color: var(--color-white);
    }

    .table-active .table-name {
      color: rgba(255, 255, 255, 0.85);
    }

    @keyframes pulse-glow {

      0%,
      100% {
        box-shadow: 0 0 24px var(--color-highlight-glow), 0 4px 16px rgba(0, 0, 0, 0.3);
      }

      50% {
        box-shadow: 0 0 36px var(--color-highlight-glow), 0 6px 24px rgba(0, 0, 0, 0.4);
      }
    }

    /* 非相關桌次 */
    .table-inactive {
      background: var(--color-inactive);
      border: 1px solid rgba(200, 85, 58, 0.08);
      color: var(--color-inactive-text);
    }

    .table-inactive .table-id {
      color: var(--color-inactive-text);
    }

    .table-inactive .table-name {
      color: rgba(200, 196, 188, 0.25);
    }

    /* ═══════════════════════════════════════════
       RETRY BUTTON
       ═══════════════════════════════════════════ */
    .btn-retry {
      flex-shrink: 0;
      margin-top: 18px;
      margin-bottom: 12px;
      padding: 12px 36px;
      font-family: var(--font-cjk);
      font-size: .95rem;
      font-weight: 500;
      color: var(--color-accent);
      background: transparent;
      border: 1.5px solid var(--color-accent);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .3s var(--ease);
      letter-spacing: 0.06em;
    }

    .btn-retry:hover {
      background: rgba(200, 85, 58, 0.1);
      box-shadow: 0 4px 16px rgba(200, 85, 58, 0.15);
    }

    .btn-retry:active {
      transform: scale(.96);
      background: var(--color-accent);
      color: var(--color-white);
    }

    /* ═══════════════════════════════════════════
       NOT FOUND
       ═══════════════════════════════════════════ */
    .not-found-card {
      text-align: center;
      max-width: 340px;
    }

    .nf-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .nf-title {
      font-size: 1.3rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--color-white-warm);
    }

    .nf-desc {
      font-size: .88rem;
      color: var(--color-white-muted);
      margin-bottom: 22px;
    }

    /* ═══════════════════════════════════════════
       ERROR
       ═══════════════════════════════════════════ */
    .error-msg {
      text-align: center;
      color: var(--color-accent);
      font-size: .95rem;
      line-height: 1.6;
    }

    .error-msg small {
      color: var(--color-white-muted);
      font-size: .78rem;
    }

    /* ═══════════════════════════════════════════
       RESPONSIVE
       ═══════════════════════════════════════════ */
    @media (min-width: 600px) {
      .table-name {
        font-size: .8rem;
      }

      .seating-layout {
        max-width: 720px;
      }
    }

    @media (min-width: 1024px) {
      .seating-layout {
        max-width: 820px;
      }
    }

    /* ═══════════════════════════════════════════
       FILM GRAIN (from main site)
       ═══════════════════════════════════════════ */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    }

    /* ═══ NOT-FOUND MODAL ═══ */
    .nf-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 26, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
      animation: nf-fade-in .2s ease;
    }

    .nf-modal-overlay.hidden {
      display: none;
    }

    @keyframes nf-fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .nf-modal {
      background: #fff;
      border-radius: 16px;
      padding: 36px 32px 28px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.22);
      animation: nf-modal-up .25s ease;
    }

    @keyframes nf-modal-up {
      from {
        transform: translateY(14px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .nf-modal-icon {
      font-size: 1.8rem;
      color: #c8553a;
      margin-bottom: 14px;
      line-height: 1;
    }

    .nf-modal-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 10px;
    }

    .nf-modal-text {
      font-size: .88rem;
      color: #7a7a7a;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .nf-modal-btn {
      display: inline-block;
      padding: 11px 36px;
      background: #c8553a;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: .95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }

    .nf-modal-btn:hover {
      background: #e07455;
    }

    .nf-modal-btn:active {
      transform: scale(.96);
    }

    /* ═══ AUTOCOMPLETE ═══ */
    .input-autocomplete-wrap {
      position: relative;
      flex: 1;
    }

    .autocomplete-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1.5px solid rgba(200, 85, 58, 0.2);
      border-radius: 12px;
      overflow: hidden;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0,0,0,.15);
    }

    .autocomplete-list.hidden { display: none; }

    .autocomplete-item {
      padding: 11px 16px;
      font-size: .88rem;
      cursor: pointer;
      color: #1a1a1a;
      border-bottom: 1px solid rgba(200, 85, 58, 0.1);
      transition: background .12s;
    }

    .autocomplete-item:last-child { border-bottom: none; }

    .autocomplete-item:hover {
      background: rgba(200, 85, 58, 0.08);
      color: #c8553a;
    }
  </style>
</head>

<body>

  <!-- ══ 載入畫面 ══ -->
  <div id="screen-loading" class="screen visible">
    <div class="loader-wrap">
      <div class="loader-ring"></div>
      <p class="loader-text">Loading…</p>
    </div>
  </div>

  <!-- ══ 姓名輸入畫面 ══ -->
  <div id="screen-input" class="screen hidden">
    <div class="input-card">

      <h1 class="input-title">座位查詢</h1>
      <div class="accent-line"></div>
      <p class="input-desc">請輸入您的姓名以查詢桌次</p>
      <div class="input-field-wrap">
        <div class="input-autocomplete-wrap">
          <input id="guest-name" type="text" placeholder="請輸入姓名" autocomplete="off">
          <div id="autocomplete-list" class="autocomplete-list hidden"></div>
        </div>
        <button id="btn-search" type="button">查詢</button>
      </div>
    </div>
    <div class="decorative-petals" aria-hidden="true">
      <span class="petal p1">❀</span>
      <span class="petal p2">❀</span>
      <span class="petal p3">❀</span>
    </div>
  </div>

  <!-- ══ 查詢結果畫面 ══ -->
  <div id="screen-result" class="screen hidden">
    <div id="result-info" class="result-info"></div>

    <div class="seating-layout">
      <!-- 主場地 -->
      <section class="zone zone-main">
        <h2 class="zone-title">大廳</h2>
        <div id="grid-main-hall" class="table-grid grid-main"></div>
      </section>

      <!-- 分隔線 -->
      <div class="zone-divider"></div>

      <!-- 包廂 -->
      <section class="zone zone-private">
        <h2 class="zone-title">包廂區</h2>
        <div id="grid-private-room" class="table-grid grid-private"></div>
      </section>
    </div>

    <div class="result-actions">
      <button class="btn-retry" type="button">重新查詢</button>
      <a href="index.html" class="btn-retry back-btn">返回</a>
    </div>
  </div>

  <!-- ══ 查無結果畫面 ══ -->
  <div id="screen-not-found" class="screen hidden">
    <div class="not-found-card">
      <p class="nf-icon">😢</p>
      <h2 class="nf-title">查無此賓客</h2>
      <p class="nf-desc">請確認姓名後再試一次</p>
      <button class="btn-retry" type="button">重新查詢</button>
    </div>
  </div>

  <!-- ══ 查無結果彈窗 ══ -->
  <div id="modal-not-found" class="nf-modal-overlay hidden" aria-modal="true" role="dialog">
    <div class="nf-modal">
      <div class="nf-modal-icon">✦</div>
      <p class="nf-modal-title">查無此賓客</p>
      <p class="nf-modal-text">請輸入正確姓名<br>或問卷調查填寫的主要姓名</p>
      <button id="btn-nf-close" class="nf-modal-btn" type="button">重新輸入</button>
    </div>
  </div>

  <!-- Scripts — 引用 chairForU 的 JS 模組 -->
  <script src="chairForU/js/utils.js"></script>
  <script src="chairForU/js/DataLoader.js"></script>
  <script src="chairForU/js/SearchEngine.js"></script>
  <script src="chairForU/js/UIRenderer.js"></script>
    <script>
      /**
       * App — 座位查詢系統入口（適配 seat.html 路徑）
       */
      (async function initApp() {
        try {
          // 1. 載入設定（指向 chairForU/data/ 目錄）
          const cfgRes = await fetch('./chairForU/data/config.json');
          const config = await cfgRes.json();

          // 修正 jsonPath 以適配 seat.html 所在的根目錄
          if (config.jsonPath && config.jsonPath.startsWith('./data/')) {
            config.jsonPath = './chairForU/data/' + config.jsonPath.replace('./data/', '');
          }

          // 2. 載入資料
          const loader = new DataLoader(config);
          const data = await loader.load();

          // 3. 建立搜尋引擎
          const engine = new SearchEngine();
          engine.buildIndex(data.tables);

          // 4. 初始化 UI
          const ui = new UIRenderer({
            tables: data.tables,
            searchEngine: engine,
            onSearch(query) {
              const result = engine.search(query);
              ui.renderResult(result);
            }
          });

          // 5. 顯示輸入畫面
          ui.showScreen('input');

        } catch (err) {
          console.error('初始化失敗:', err);
          const el = document.getElementById('screen-loading');
          if (el) {
            const p = document.createElement('p');
            p.className = 'error-msg';
            p.textContent = '載入失敗，請重新整理頁面';
            const small = document.createElement('small');
            small.textContent = err.message;
            p.appendChild(document.createElement('br'));
            p.appendChild(small);
            el.textContent = '';
            el.appendChild(p);
          }
        }
      })();
    </script>
  </div>
</body>

</html>
